<!doctype html>
<html>
  <head>
    <title>Long Press Test</title>
    <style>
      #selectable {
        user-select: text;
        -webkit-user-select: text; /* For Safari */
        -moz-user-select: text; /* For Firefox */
        -ms-user-select: text; /* For IE/Edge */
      }
    </style>
  </head>
  <body>
    <p id="selectable">This is some selectable text.</p>
  </body>
</html>
